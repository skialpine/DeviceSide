name: Report a device test result or bug
description: Tell us how DeviceSide worked on your device(s), or report a problem with them.
title: "Device report: "
labels: ["device-report"]
body:
  # Options: each integration's title, then the catch-all; scripts/route_issue.py reads them to label the issue and
  # assign the integration's maintainers. tests/test_issue_templates.py keeps the list in step with the integrations.
  - type: dropdown
    id: integration
    attributes:
      label: Integration
      description: The integration of each device you tested. Its maintainers are assigned to the report.
      multiple: true
      options:
        - Control4
        - Hue
        - Matter
        - Shelly
        - ZHA
        - Zigbee2MQTT
        - Other or not sure
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Devices
      description: One line per device you tested, as shown on its device page in Home Assistant. Filled in when you start from DeviceSide's options.
      placeholder: integration · product name · model · firmware
    validations:
      required: true
  - type: checkboxes
    id: worked
    attributes:
      label: Features that worked
      description: Features you tested that worked as expected.
      options:
        - label: turn_on_for
        - label: turn_off_for
        - label: set_auto_off & clear_auto_off
        - label: set_auto_on & clear_auto_on
        - label: smooth dimming, including fast raise-stop-raise & raise-stop-lower sequences
        - label: color saturation transitions, including fast raise-stop-raise & raise-stop-lower sequences
        - label: color hue transitions, including fast raise-stop-raise & raise-stop-lower sequences
        - label: set_attributes
        - label: set_scene
        - label: get_attributes
        - label: other (say which in the notes)
  - type: checkboxes
    id: failed
    attributes:
      label: Features that didn't work
      description: Features you tested that didn't work as expected. Say what happened in the notes.
      options:
        - label: turn_on_for
        - label: turn_off_for
        - label: set_auto_off & clear_auto_off
        - label: set_auto_on & clear_auto_on
        - label: smooth dimming, including fast raise-stop-raise & raise-stop-lower sequences
        - label: color saturation transitions, including fast raise-stop-raise & raise-stop-lower sequences
        - label: color hue transitions, including fast raise-stop-raise & raise-stop-lower sequences
        - label: set_attributes
        - label: set_scene
        - label: get_attributes
        - label: other (say which in the notes)
  - type: textarea
    id: notes
    attributes:
      label: Notes on failed tests and bugs
      description: "For a bug, attach a debug log: on DeviceSide's integration page, select Enable debug logging, reproduce the problem, then disable it and attach the log it downloads. Entity names appear in the log: rename any you'd rather not share before attaching it."
      placeholder: |
        1. What I expected to happen:
        1. What actually happened:
        1. Steps to reproduce:
        1. YAML and/or logs (if relevant):
  - type: input
    id: experimental_features
    attributes:
      label: Was Experimental features on?
      description: "on or off: DeviceSide's options, Configure > Settings. Filled in when you start from there."
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true
  - type: input
    id: deviceside_version
    attributes:
      label: DeviceSide version
      description: "The release you tested, such as 0.2.0, or 0.2.0rc1 for a release candidate: your report counts as a test of that release's code. Filled in when you start from DeviceSide's options, which show a release candidate as its release, so add the rcN (HACS shows which you installed)."
    validations:
      required: true
